homepage: https://github.com/Zamoca42/hermes-completion-sound
description: >
  Pick the sound Hermes Desktop plays when a turn finishes: one of Hermes' 14
  built-in presets or your own audio file (mp3, wav, ogg), with an optional
  different sound at night. Desktop-only (desktop/plugin.js inside the plugin
  SDK surface); no agent tools, hooks or env vars.
